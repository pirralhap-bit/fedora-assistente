<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
/*HEAD*/
<style>
/*CSS*/
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div class="app">
  <aside class="pane side" aria-label="Contexto">
    <div class="brand"><span class="dot" aria-hidden="true"></span><h1>Jarvis</h1></div>
    <div class="time">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">—</div>
      <div class="status" id="pregao">B3</div>
    </div>
    <section class="sec" aria-labelledby="h-maq">
      <h2 id="h-maq">Máquina <span class="note">simulado</span></h2>
      <div class="meters" id="meters"></div>
      <div class="ollama" id="ollama">Ollama parado</div>
    </section>
    <section class="sec"><h2>Projetos</h2><ul class="list" id="projects"></ul></section>
    <section class="sec"><h2>Editadas recentemente</h2><ul class="list" id="recent"></ul></section>
    <section class="sec"><h2>Inbox</h2><div class="chip" id="inbox"></div></section>
  </aside>

  <main class="pane stage" id="stage">
    <canvas id="g" role="img" aria-label="Grafo das notas do vault. Use a lista de projetos, as notas recentes ou a conversa para focar uma nota."></canvas>
    <div class="gtitle"><b>Cofre Principal</b><span id="gstats"></span></div>
    <div class="tools">
      <button class="ib" id="zin" aria-label="Aproximar">+</button>
      <button class="ib" id="zout" aria-label="Afastar">−</button>
      <button class="ib" id="fit" aria-label="Ver o vault inteiro">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
  </main>

  <section class="pane dictpane" id="p-dict" aria-label="Ditado" hidden>
    <div class="dhead">
      <div class="field">
        <label for="dest">Escrever em</label>
        <select id="dest" name="destino"></select>
      </div>
      <button class="rec" type="button" id="rec" aria-pressed="false"><span class="recdot" aria-hidden="true"></span><span id="rec-l">Ditar</span><span class="rect" id="rect">0:00</span></button>
    </div>
    <div class="dcols">
      <div class="field grow">
        <label for="raw">O que você falou <span class="note">whisper.cpp</span></label>
        <textarea id="raw" name="transcricao" placeholder="Toque em Ditar e fale à vontade, ou escreva aqui…"></textarea>
      </div>
      <div class="field grow">
        <label for="out">Como vai ficar na nota <span class="note">Ollama reescreve</span></label>
        <textarea id="out" name="resultado" placeholder="O Ollama organiza e reescreve o que você falou, em Markdown. Você pode editar antes de salvar."></textarea>
      </div>
    </div>
    <div class="dfoot">
      <button type="button" class="ghost" id="tidy">Organizar com Ollama</button>
      <button type="button" class="ghost" id="read">Ler em voz alta</button>
      <span class="hint" id="dhint" aria-live="polite"></span>
      <button type="button" class="send" id="save">Salvar na nota</button>
    </div>
  </section>

  <section class="pane chat" aria-label="Conversa">
    <header>
      <div class="tabs" role="group" aria-label="Centro da tela">
        <button type="button" id="t-chat" aria-pressed="true">Grafo</button>
        <button type="button" id="t-dict" aria-pressed="false">Ditado</button>
      </div>
      <small>modo teste · sem IA</small>
    </header>
    <div class="panel" id="p-chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="sugg" id="sugg"></div>
      <form id="f">
        <label class="sr" for="q">Mensagem para o Jarvis</label>
        <input id="q" name="mensagem" autocomplete="off" placeholder="Pergunte ao Jarvis…">
        <button class="mic" type="button" id="mic" aria-label="Ditar uma nota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="send" type="submit">Enviar</button>
      </form>
    </div>
  </section>
</div>

<script>
const DATA = /*DATA*/null;
/*JS*/
</script>
