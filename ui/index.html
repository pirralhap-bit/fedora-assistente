<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fedora</title>
<meta name="theme-color" content="#030305">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
/* Layout: one dark sky. A black hole in the centre listens; system data drifts on its left orbit, vault data on its right. No boxes.
   #notas swaps to a quiet writing page with a small hole that still listens. Single deliberate dark theme. */
:root{
  --space:#030305; --ink:#ece6dc; --dim:#8a8378; --faint:#4a463f; --hot:#ffb15c; --white-hot:#fff1d6; --cool:#8fb4ff; --warn:#ff8a5c;
  --ui:"Manrope",system-ui,sans-serif; --data:"JetBrains Mono",ui-monospace,monospace; --write:"Literata",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font:400 15px/1.5 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--hot);outline-offset:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- home: the black hole ---------- */
#home{position:fixed;inset:0}
#left{position:absolute;left:0;top:0;bottom:0;width:60%;overflow:hidden}
#sky,#hole,#brain{position:absolute;inset:0;width:100%;height:100%;display:block}
#hole,#brain{cursor:pointer}
/* bloco "sistema" (topo do painel da direita, fora da área do cérebro): PC em duas colunas, plano do Claude em destaque */
#sys{display:grid;gap:10px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid #15140f}
.sg h2{margin:0 0 6px;font:400 10.5px var(--data);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#orbits,#clm{display:grid;grid-template-columns:1fr 1fr;gap:9px 24px}
#clm{grid-template-columns:1fr;gap:9px}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:10px;row-gap:4px;min-width:0}
.m .k{font:300 11px var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.m .v{font:400 14px var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.m .v.hot{color:var(--warn)}
.m .v.hot::before{content:"▲ ";font-size:10px}
.m .bar{grid-column:1/-1;position:relative;height:3px;background:#1a1812;overflow:hidden}
.m .bar::after{content:"";position:absolute;inset:0;background:var(--hot);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .6s ease-out}
.m .v.hot~.bar::after{background:var(--warn)}
.m .s{grid-column:1/-1;display:none;font:300 11px var(--data);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clm .m{grid-template-columns:auto minmax(0,1fr) auto}
#clm .m .v{font-size:16px;font-weight:300;order:3}
#clm .s{display:block;grid-column:auto;order:2;text-align:right}
#clm .bar{order:4}
#orbits .m.wide{grid-column:1/-1}
#orbits .m.wide .v{text-align:left}
.voice{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(640px,calc(100% - 32px));display:grid;gap:10px;justify-items:center;text-align:center}
.state{font:400 11px var(--data);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);display:flex;gap:10px;align-items:center}
.state i{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:background-color .3s}
body[data-v="listen"] .state i,body[data-v="dict"] .state i{background:var(--hot);box-shadow:0 0 10px var(--hot)}
body[data-v="think"] .state i{background:var(--cool)}
.heard{font:300 26px/1.3 var(--ui);min-height:1.3em;color:var(--ink);text-wrap:balance}
.reply{font-size:14px;color:var(--dim);min-height:1.5em;max-width:56ch;text-wrap:pretty}
.reply.long{max-height:38vh;overflow:auto;text-align:left;color:var(--ink)}
.reply.long pre{overflow-x:auto;padding:8px 0 8px 12px;border-left:2px solid var(--faint)}
.reply.long table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
.reply.long th,.reply.long td{padding:3px 12px 3px 0;text-align:left}
.cmds{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:13px}
.cmd{background:none;border:0;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.cmd:hover{color:var(--ink);border-bottom-color:var(--faint)}
.typed{display:flex;gap:14px;align-items:center;width:min(420px,100%)}
.typed input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--faint);padding:6px 2px;font-size:14px;text-align:center}
.typed input:focus-visible{outline:none;border-bottom-color:var(--hot)}
.typed input::placeholder{color:var(--faint)}
.mute{background:none;border:0;font:400 11px var(--data);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:4px 0}
.mute:hover{color:var(--ink)}
.mute[aria-pressed="true"]{color:var(--warn)}
.proto{max-width:calc(100% - 32px);text-align:center;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:400 10px var(--data);letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

/* ---------- home, right half: timeline of our conversations ---------- */
#tline{box-sizing:border-box;position:absolute;right:0;top:0;bottom:0;width:40%;display:flex;flex-direction:column;min-height:0;border-left:1px solid #15140f;background:rgba(3,3,5,.55);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 20px 32px}
.tlh{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:14px}
.tlh h2{margin:0;font:400 10.5px var(--data);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#tlist{flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px 0;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#tlist:empty::before{content:"Nada por aqui ainda. O que a gente conversar aparece nesta linha.";color:var(--faint);font-size:13px}
.td{margin:18px 0 6px 20px;font:400 10.5px var(--data);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.td:first-child{margin-top:0}
.te{position:relative;margin:0 0 14px 3px;padding:0 0 0 20px;border-left:1px solid var(--faint)}
.te::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.te.live::before{background:var(--hot);box-shadow:0 0 8px var(--hot);animation:tlp 1s ease-in-out infinite}
.te.bad::before{background:var(--warn)}
.te time{font:300 11px var(--data);color:var(--faint)}
.te time b{font-weight:400;color:var(--dim);margin-left:8px;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.te .ty{color:var(--ink);font-size:14px;margin:2px 0;overflow-wrap:anywhere}
.te .ta{color:var(--dim);font-size:13px;line-height:1.55;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;cursor:pointer;white-space:pre-wrap}
.te .ta:empty{display:none}
.te.open .ta{-webkit-line-clamp:unset;display:block;color:var(--ink)}
.te .tk{margin-top:3px;font:300 11px var(--data);color:var(--faint);display:grid;gap:1px}
.te .tk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.te .tk .bad{color:var(--warn)}

/* ---------- #notas: the writing page ---------- */
#notes{position:fixed;inset:0;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr auto;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));column-gap:32px}
.nhead{grid-column:1/-1;display:flex;align-items:baseline;gap:20px;padding-bottom:18px}
.back{color:var(--dim);text-decoration:none;font-size:13px}
.back:hover{color:var(--ink)}
.nhead h1{margin:0;font:500 24px var(--write);letter-spacing:-.01em}
.npath{font:300 11px var(--data);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.days{overflow-y:auto;display:grid;align-content:start;gap:2px;padding-right:8px}
.days h2{margin:0 0 8px;font:400 10.5px var(--data);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.day{background:none;border:0;text-align:left;padding:5px 0;color:var(--dim);font-size:14px}
.day:hover{color:var(--ink)}
.day[aria-current="true"]{color:var(--hot)}
.page{min-width:0;min-height:0;display:flex;justify-content:center}
#text{width:min(72ch,100%);height:100%;resize:none;background:none;border:0;padding:0 0 40px;
  font:400 19px/1.75 var(--write);color:var(--ink);caret-color:var(--hot)}
#text:focus-visible{outline:none}
#text::placeholder{color:var(--faint)}
.nfoot{grid-column:1/-1;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding-top:14px;border-top:1px solid #15140f}
#mini{width:140px;height:96px;margin:-22px -14px;flex:none;cursor:pointer;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent);mask-image:radial-gradient(closest-side,#000 78%,transparent)}
.nstate{display:grid;min-width:0;flex:1 1 220px}
.nstate b{font:400 11px var(--data);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:400}
.nstate span{font-size:13px;color:var(--faint)}
.act{background:none;border:0;padding:6px 0;font-size:14px;color:var(--dim);border-bottom:1px solid transparent}
.act:hover{color:var(--ink);border-bottom-color:var(--faint)}
.act.primary{color:var(--hot)}
.act:disabled{opacity:.4;cursor:default;border-color:transparent}
.act[aria-pressed="true"]{color:var(--warn)}

/* ---------- #chat: typed conversation, Claude Code style ---------- */
#chat{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#chat .nhead{justify-content:center}
#chat .nhead>*{flex:none}
.clog{overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:24px}
.clog>*{width:min(720px,100%)}
.me{margin:22px 0 6px;color:var(--dim);white-space:pre-wrap}
.me::before{content:"você";display:block;font:400 10.5px var(--data);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.ai{line-height:1.65}
.ai p,.ai ul,.ai ol,.ai pre,.ai table{margin:0 0 12px}.ai ul{padding-left:20px}
.ai h3{margin:16px 0 6px;font:500 16px var(--ui);color:var(--white-hot)}
.ai code{font:400 13px var(--data);color:var(--white-hot)}
.ai pre{overflow-x:auto;padding:10px 0 10px 14px;border-left:2px solid var(--faint)}
.ai pre code{color:var(--ink);white-space:pre}
.ai table{border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}
.ai th,.ai td{padding:4px 14px 4px 0;text-align:left;border-bottom:1px solid #1d1b16}.ai th{color:var(--dim);font-weight:500}
.ai a{color:var(--hot)}
.tl{margin:6px 0 10px;padding:2px 0 2px 12px;border-left:1px solid var(--faint);font:300 12px var(--data);color:var(--faint)}
.tlr{display:flex;align-items:baseline;gap:8px;margin:3px 0;white-space:nowrap;overflow:hidden}
.tlr i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint);align-self:center}
.tlr span{overflow:hidden;text-overflow:ellipsis}.tlr em{margin-left:auto;font-style:normal;padding-left:10px}
.tlr.ag span{color:var(--ink)}.tlr.sub{margin-left:16px}
.tlr.ok i{background:var(--dim)}.tlr.run i{background:var(--hot);animation:tlp 1s ease-in-out infinite}.tlr.bad i{background:var(--warn)}
@keyframes tlp{50%{opacity:.25}}
.tool{font:300 12px var(--data);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.tool b{font-weight:400;color:var(--dim)}
.tool.bad b{color:var(--warn)}
.ouvir{background:none;border:0;text-align:left;padding:2px 0;font:400 11px var(--data);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ouvir:hover{color:var(--ink)}
.cfoot{display:flex;align-items:flex-end;gap:18px;justify-content:center;padding-top:12px;border-top:1px solid #15140f}
#chole{width:140px;height:96px;margin:-22px -14px;flex:none;cursor:pointer;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent);mask-image:radial-gradient(closest-side,#000 78%,transparent)}
.cin{flex:1;max-width:720px;display:grid;gap:4px}
#cin{resize:none;background:none;border:0;border-bottom:1px solid var(--faint);padding:6px 2px;max-height:30vh;font-size:15px;line-height:1.5;caret-color:var(--hot)}
#cin:focus-visible{outline:none;border-bottom-color:var(--hot)}
#cin::placeholder{color:var(--faint)}
#cstate{font:300 11px var(--data);color:var(--faint);min-height:1.5em}

@media (max-width:760px){
  body{overflow:auto}
  #left{width:100%;bottom:auto;height:62%}
  #tline{width:100%;top:62%;border-left:0;border-top:1px solid #15140f;padding:12px 16px 12px}
  #notes{position:static;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .days{display:flex;overflow-x:auto;gap:16px;padding-bottom:10px}.days h2{display:none}.day{white-space:nowrap}
  #text{min-height:55vh;font-size:17px}
  .heard{font-size:20px}
  .voice{gap:6px;bottom:calc(28px + env(safe-area-inset-bottom,0px))}.reply:empty{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="home" aria-label="Fedora">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="left">
  <canvas id="brain" role="button" tabindex="0" aria-label="Cérebro da Fedora: mostra o que ela está fazendo. Toque ou aperte Espaço para falar. Arraste para girar."></canvas>
  <canvas id="hole" role="button" tabindex="0" aria-label="Buraco negro da Fedora. Toque ou aperte Espaço para falar sem dizer o nome."></canvas>
  <div class="proto" id="status">conectando…</div>
  <div class="voice">
    <div class="state" id="state"><i aria-hidden="true"></i><span id="state-t">Toque ou aperte Espaço para falar</span></div>
    <div class="heard" id="heard" aria-live="polite"></div>
    <div class="reply" id="reply" aria-live="polite"></div>
    <div class="cmds" id="cmds"></div>
    <form class="typed" id="typed">
      <label class="sr" for="cmd">Comando</label>
      <input id="cmd" name="comando" autocomplete="off" placeholder="ou digite um comando…">
      <button type="button" class="mute" id="visual" title="Trocar o visual da tela inicial">visual: cérebro</button>
      <button type="button" class="mute" id="mute" aria-pressed="false">mic ligado</button>
    </form>
  </div>
  </div>
  <aside id="tline" aria-label="Sistema e linha do tempo das conversas">
    <div id="sys">
      <section class="sg" aria-labelledby="h-pc"><h2 id="h-pc">Computador</h2><div id="orbits"></div></section>
      <section class="sg" aria-labelledby="h-cl"><h2 id="h-cl">Plano do Claude</h2><div id="clm"></div></section>
    </div>
    <header class="tlh"><h2>Conversas</h2><button type="button" class="mute" id="tlclear" title="Limpa só esta lista, não apaga nada do PC">limpar</button></header>
    <div id="tlist" aria-live="polite"></div>
  </aside>
</section>

<section id="notes" aria-label="Notas diárias" hidden>
  <header class="nhead">
    <a class="back" id="back" href="#">← Fedora</a>
    <h1 id="n-title">Hoje</h1>
    <span class="npath" id="n-path"></span>
  </header>
  <nav class="days" aria-label="Notas diárias recentes"><h2>Diárias</h2><div id="days" style="display:contents"></div></nav>
  <div class="page">
    <label class="sr" for="text">Texto da nota</label>
    <textarea id="text" name="nota" spellcheck="true" placeholder="Escreva, ou clique no buraco negro para ditar…"></textarea>
  </div>
  <footer class="nfoot">
    <canvas id="mini" role="button" tabindex="0" aria-label="Ditar"></canvas>
    <div class="nstate"><b id="n-state"></b><span id="n-hint"></span></div>
    <button type="button" class="act" id="dictate" aria-pressed="false">Ditar</button>
    <button type="button" class="act" id="tidy">Organizar</button>
    <button type="button" class="act" id="undo" disabled>Desfazer</button>
    <button type="button" class="act primary" id="save">Salvar</button>
  </footer>
</section>

<section id="chat" aria-label="Chat" hidden>
  <header class="nhead">
    <a class="back" href="#">← Fedora</a>
    <h1>Chat</h1>
    <button type="button" class="act" id="cnew">Nova conversa</button>
  </header>
  <div class="clog" id="clog" aria-live="polite"></div>
  <footer class="cfoot">
    <canvas id="chole" role="button" tabindex="0" aria-label="Falar em vez de digitar"></canvas>
    <form class="cin" id="cform">
      <label class="sr" for="cin">Mensagem</label>
      <textarea id="cin" rows="1" placeholder="Escreva… (Enter envia, Shift+Enter quebra a linha, Esc interrompe)"></textarea>
      <span id="cstate"></span>
    </form>
    <button type="button" class="act primary" id="csend">Enviar</button>
  </footer>
</section>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const tz='America/Sao_Paulo';
const fmt=(o,d=new Date())=>new Intl.DateTimeFormat('pt-BR',{timeZone:tz,...o}).format(d);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const wait=ms=>new Promise(r=>setTimeout(r,reduce.matches?Math.min(ms,120):ms));

// ================= black hole renderer (shared by the home and the editor) =================
class Hole{
  constructor(cv,{count=1600,scale=1,r=0,stars=false}={}){this.cv=cv;this.cx=cv.getContext('2d');this.scale=scale;this.r=r;this.level=.1;this.goal=.1;this.spin=1;this.t=0;
    this.p=Array.from({length:count},()=>{const r=1.35+Math.pow(Math.random(),1.6)*2.1;return{r,a:Math.random()*Math.PI*2,z:(Math.random()-.5)*.08*r,s:.6+Math.random()*1.4,k:Math.random()}});
    this.resize()}
  resize(){const d=devicePixelRatio||1,w=this.cv.clientWidth,h=this.cv.clientHeight;this.w=w;this.h=h;this.cv.width=w*d;this.cv.height=h*d;this.cx.setTransform(d,0,0,d,0,0);
    const narrow=this.scale===1&&innerWidth<760;this.R=this.r||Math.min(w,h)*(narrow?.09:.11)*this.scale;this.X=w/2;this.Y=this.r||this.scale>1?h/2:h*(narrow?.2:.44)}
  col(r,alpha){const t=Math.max(0,Math.min(1,(r-1.35)/2.1));// hot white inside, amber, then deep red outside
    const c=t<.25?[255,241,214]:t<.6?[255,177,92]:[214,92,52];return`rgba(${c[0]},${c[1]},${c[2]},${alpha})`}
  frame(dt){
    this.level+=(this.goal-this.level)*Math.min(1,dt*6);const L=this.level;this.t+=dt;
    const{cx,R,X,Y}=this,tilt=.24,speed=(.25+L*1.6)*this.spin;
    cx.clearRect(0,0,this.w,this.h);
    // outer glow
    let g=cx.createRadialGradient(X,Y,R*.9,X,Y,R*(4.2+L));g.addColorStop(0,`rgba(255,160,80,${.10+L*.18})`);g.addColorStop(1,'rgba(255,120,60,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,R*(4.2+L),0,Math.PI*2);cx.fill();
    const TAU=Math.PI*2,band=(clipFront)=>{cx.save();if(clipFront){cx.beginPath();cx.rect(0,Y,this.w,this.h);cx.clip();cx.beginPath();cx.arc(X,Y,R*1.01,0,TAU);cx.clip()}
      cx.translate(X,Y);cx.scale(1,tilt);const b=cx.createRadialGradient(0,0,R*1.2,0,0,R*3.6);
      b.addColorStop(0,'rgba(255,236,200,0)');b.addColorStop(.08,`rgba(255,214,150,${.5+L*.35})`);b.addColorStop(.35,`rgba(255,150,70,${.22+L*.2})`);b.addColorStop(1,'rgba(200,70,40,0)');
      cx.fillStyle=b;cx.beginPath();cx.arc(0,0,R*3.6,0,TAU);cx.arc(0,0,R*1.2,0,TAU,true);cx.fill();cx.restore()};
    cx.globalCompositeOperation='lighter';band(false);

  ta.setSelectionRange(...dictRange);ta.focus();hint('Ditado inserido e selecionado. Clique em “Organizar”.')}
async function tidyText(){
  if(!ta.value.trim())return hint('A nota está vazia.');
  $('tidy').disabled=true;setV('think');hint('Gemini lendo e reorganizando a nota inteira…');
  try{const r=await api('/api/tidy',{note:ta.value});prevText=ta.value;ta.value=r.text;dictRange=null;
    $('undo').disabled=false;hint('Pronto. Revise e salve; “Desfazer” volta à nota de antes.')}
  catch(e){hint(errMsg(e))}finally{$('tidy').disabled=false;setV('idle')}}
$('dictate').onclick=dictate;$('tidy').onclick=tidyText;$('save').onclick=saveNote;
$('mini').addEventListener('click',dictate);$('mini').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dictate()}});
$('undo').onclick=()=>{if(prevText==null)return;ta.value=prevText;prevText=null;$('undo').disabled=true;hint('Texto original de volta.')};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&!$('notes').hidden){e.preventDefault();saveNote()}});
addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
$('back').addEventListener('click',e=>{if(dirty()&&!confirm('Há alterações não salvas. Sair mesmo assim?'))e.preventDefault()});

// ================= chat =================
// tiny markdown: escape first, then only the shapes Claude uses (code, headings, lists, tables, bold, links)
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
const LI=/^\s*([-*]|\d+\.)\s+/,ROW=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
function block(t){return t.split(/\n{2,}/).map(b=>{b=b.replace(/^\n+|\s+$/g,'');if(!b)return'';const ls=b.split('\n');
  const h=b.match(/^#{1,4}\s+(.*)$/);if(h&&ls.length===1)return`<h3>${inl(h[1])}</h3>`;
  if(ls.every(l=>LI.test(l)))return`<ul>${ls.map(l=>`<li>${inl(l.replace(LI,''))}</li>`).join('')}</ul>`;
  if(ls.length>1&&ls.every(l=>/^\s*\|.*\|\s*$/.test(l))){const rows=ls.filter(l=>!/^\s*\|[\s:|-]+\|\s*$/.test(l)).map(ROW);
    return`<table><tr>${rows[0].map(c=>`<th>${inl(c)}</th>`).join('')}</tr>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</table>`}
  return`<p>${ls.map(inl).join('<br>')}</p>`}).join('')}
const md=src=>src.split(/^```[^\n]*$/m).map((p,i)=>i%2?`<pre><code>${esc(p.replace(/^\n|\n$/g,''))}</code></pre>`:block(p)).join('');
const plain=s=>s.replace(/```[\s\S]*?(```|$)/g,' O código está na tela. ').replace(/[*#`|>_]/g,' ').replace(/\s+/g,' ').trim();
const clog=$('clog'),cin=$('cin'),cstate=t=>{$('cstate').textContent=t};
const saveLog=()=>{try{sessionStorage.setItem('fedora-chat',clog.innerHTML)}catch{}};
try{clog.innerHTML=sessionStorage.getItem('fedora-chat')||''}catch{}
// linha do tempo de um turno: quem recebeu, quem foi acionado (subagentes) e o que cada um usou
function timeline(){const box=el('div','tl'),t0=performance.now(),rows={};
  const fmt=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
  const add=(txt,cls,id)=>{const r=el('div','tlr '+cls);r.append(el('i'),el('span',null,txt),el('em',null,cls.includes('run')?'':fmt(performance.now()-t0)));r._t=performance.now();box.append(r);if(id)rows[id]=r;return r};
  const close=(r,ok)=>{r.classList.replace('run',ok?'ok':'bad');r.lastChild.textContent=fmt(performance.now()-r._t)};
  add('Fedora (tech lead) recebeu o pedido','ok');
  return{box,
    start(ev){const ag=ev.agent,sub=ev.parent&&rows[ev.parent];
      add(ag?`→ ${ag}: ${ev.desc||'tarefa delegada'}`:`${ev.name} ${ev.input||''}`,(ag?'ag ':'')+'run'+(sub?' sub':''),ev.id);return ag},
    end(ev){const r=rows[ev.id];if(r)close(r,ev.ok)},
    finish(ok){box.querySelectorAll('.run').forEach(r=>close(r,ok));add(ok?'Resposta pronta':'Interrompido','ok')}}}
async function chatSend(text){
  text=(text||'').trim();if(!text)return;if(busy)return cstate('Espere a resposta atual (ou Esc para interromper).');
  busy=true;setV('think');clog.append(el('div','me',text));const tt=tlTurn(text,'chat');
  const ai=el('div','ai');let out='',tl=null,failed=false;const scroll=()=>clog.scrollTop=clog.scrollHeight;clog.append(ai);scroll();cstate('Pensando…');
  try{await streamRun({message:text,canal:'chat'},ev=>{
      if(ev.t==='delta'){out+=ev.text;ai.innerHTML=md(out);tt.ai(plain(out));scroll()}
      else if(ev.t==='tool'&&ev.phase==='use'){brain.use(ev);tt.tool(ev);if(!tl){tl=timeline();ai.before(tl.box)}const ag=tl.start(ev);cstate(ag?'Delegando para '+ev.agent+'…':'Usando '+ev.name+'…');scroll()}
      else if(ev.t==='tool'&&ev.phase==='result'){brain.end(ev);if(tl)tl.end(ev)}
      else if(ev.t==='error'){out+=(out?'\n\n':'')+'**Erro:** '+ev.message;ai.innerHTML=md(out);failed=true}});
    if(tl)tl.finish(!failed);tt.done(!failed);ai.dataset.raw=out;const b=el('button','ouvir','ouvir');b.type='button';ai.after(b);
    await refreshSystem();const l=S.claude&&S.claude.last;cstate(l?`${num.format(l.total)} tokens nesta resposta`:'')}
  catch(e){if(tl)tl.finish(false);ai.textContent=errMsg(e);tt.ai(errMsg(e));tt.done(false);cstate('')}
  finally{busy=false;brain.clear();setV('idle');saveLog();scroll()}}
clog.addEventListener('click',e=>{if(e.target.classList.contains('ouvir')){const ai=e.target.previousElementSibling;speak(plain(ai.dataset.raw||ai.textContent))}});
const sendTyped=()=>{const v=cin.value;if(!v.trim()||busy)return;cin.value='';cin.style.height='';chatSend(v)};
$('cform').addEventListener('submit',e=>{e.preventDefault();sendTyped()});
$('csend').onclick=sendTyped;
cin.addEventListener('input',()=>{cin.style.height='auto';cin.style.height=cin.scrollHeight+'px'});
cin.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendTyped()}});
// Esc stops the running turn, typed chat or voice (home screen): the server kills Claude and drops that channel's session
addEventListener('keydown',e=>{if(e.key!=='Escape'||!busy)return;parado=true;api('/api/cancel',{}).catch(()=>{});
  if(!$('chat').hidden)cstate('Interrompido.');else say('Interrompido.')});
$('cnew').onclick=async()=>{if(busy)return;try{await api('/api/chat/new',{})}catch(e){return cstate(errMsg(e))}clog.replaceChildren();saveLog();cstate('Conversa nova.');cin.focus()};
$('chole').addEventListener('click',tap);$('chole').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});

// ================= routing + loop =================
async function route(){const page=location.hash==='#notas'?'notes':location.hash==='#chat'?'chat':'home';
  $('home').hidden=page!=='home';$('notes').hidden=page!=='notes';$('chat').hidden=page!=='chat';
  document.title={notes:'Fedora · Notas diárias',chat:'Fedora · Chat',home:'Fedora'}[page];
  if(page==='notes'){mini.resize();try{await loadList();if(!note)await openNote(list.find(n=>n.today).id)}catch(e){hint(errMsg(e))}ta.focus()}
  else if(page==='chat'){chole.resize();clog.scrollTop=clog.scrollHeight;cin.focus()}
  else{head().resize();stars($('sky'))}}
addEventListener('hashchange',route);
addEventListener('resize',()=>{head().resize();mini.resize();chole.resize();stars($('sky'))});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{if(!$('home').hidden){head().frame(dt)}else if(!$('chat').hidden)chole.frame(dt);else mini.frame(dt)}
  catch(e){if(!loop.err){loop.err=1;console.error('frame:',e)}}   // one bad frame must not freeze the animation for good
  requestAnimationFrame(loop)}
setVisual(visual,false);setV('idle');fillOrbit();route();requestAnimationFrame(loop);
</script>
